# Single-binary Loki backing the syslog pipeline.
#
# Reachable two ways, both deliberate:
#   - grafana resolves it as loki:3100 on this compose network
#   - syslog-docker's Alloy reaches it on 127.0.0.1:3100, which is the only
#     address the port is published on. It is never bound to the LAN.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

limits_config:
  # Layer 4: the long tail lives here, not in the text files on disk.
  retention_period: ${LOKI_RETENTION_PERIOD:-90d}
  # Event logs only; this is a ceiling, not a target.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_streams_per_user: 5000
  max_global_streams_per_user: 5000
  reject_old_samples: true
  # A week, so an Alloy backlog after an outage still lands instead of being
  # silently discarded.
  reject_old_samples_max_age: 168h
  volume_enabled: true
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

ruler:
  storage:
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
