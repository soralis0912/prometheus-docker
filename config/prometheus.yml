global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: 'netdata'
    metrics_path: /api/v1/allmetrics
    params:
      format: ['prometheus']
    file_sd_configs:
      - files:
          - /tmp/prometheus-file-sd/netdata.json
