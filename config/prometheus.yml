global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /prom-config/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: 'netdata'
    metrics_path: /api/v1/allmetrics
    params:
      format: ['prometheus']
    file_sd_configs:
      - files:
          - /tmp/prometheus-file-sd/netdata.json
  - job_name: 'coder'
    scrape_interval: 15s
    scheme: http
    metrics_path: /prometheus
    tls_config:
      insecure_skip_verify: true
    file_sd_configs:
      - files:
          - /tmp/prometheus-file-sd/coder.json
  # FortiGate is polled over SNMP through snmp_exporter: the target address is
  # passed as a query parameter and the scrape itself goes to the exporter.
  - job_name: 'fortigate'
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /snmp
    params:
      auth: [fortigate_v2]
      module: [fortigate]
    file_sd_configs:
      - files:
          - /tmp/prometheus-file-sd/fortigate.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
  # The exporter's own health (SNMP timeouts, scrape durations, walk failures).
  - job_name: 'snmp-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['snmp-exporter:9116']
