global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /prom-config/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: 'netdata'
    metrics_path: /api/v1/allmetrics
    params:
      format: ['prometheus']
    file_sd_configs:
      - files:
          - /tmp/prometheus-file-sd/netdata.json
  # Coder serves its metrics at the root of the address given by
  # CODER_PROMETHEUS_ADDRESS (default :2112), not at /metrics. That listener
  # has to be bound to something reachable and published - by default Coder
  # binds 127.0.0.1, which inside a container means the container itself.
  - job_name: 'coder'
    scrape_interval: 15s
    metrics_path: /
    file_sd_configs:
      - files:
          - /tmp/prometheus-file-sd/coder.json
  # FortiGate is polled over SNMP through snmp_exporter: the target address is
  # passed as a query parameter and the scrape itself goes to the exporter.
  - job_name: 'fortigate'
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /snmp
    params:
      auth: [fortigate_v2]
      module: [fortigate]
    file_sd_configs:
      - files:
          - /tmp/prometheus-file-sd/fortigate.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
  # Printers, via the vendor-neutral Printer-MIB. Slow interval on purpose:
  # toner and page counts move over days, and printers answer SNMP slowly.
  - job_name: 'printer'
    scrape_interval: 5m
    scrape_timeout: 60s
    metrics_path: /snmp
    params:
      auth: [printer_v2]
      module: [printer]
    file_sd_configs:
      - files:
          - /tmp/prometheus-file-sd/printer.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
  # The exporter's own health (SNMP timeouts, scrape durations, walk failures).
  - job_name: 'snmp-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['snmp-exporter:9116']
  # The syslog pipeline, so "did we stop receiving" is a metric with history
  # rather than something you only see by opening a log panel. Alloy belongs to
  # the syslog-docker project, so it comes from .env like every other external
  # target - a deployment without that project just leaves it unset.
  - job_name: 'syslog-alloy'
    scrape_interval: 30s
    file_sd_configs:
      - files:
          - /tmp/prometheus-file-sd/syslog-alloy.json
  # Loki is defined in this compose project, so naming it here is safe.
  - job_name: 'loki'
    scrape_interval: 30s
    static_configs:
      - targets: ['loki:3100']
